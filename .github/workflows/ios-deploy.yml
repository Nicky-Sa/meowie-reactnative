on:
  push:
    branches:
      - ios-preview
      - ios-production

jobs:
  build-and-upload:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine APP_VARIANT
        run: |
          case "${{ github.ref_name }}" in
            ios-production)
              echo "APP_VARIANT=production" >> "$GITHUB_ENV"
              ;;
            ios-preview)
              echo "APP_VARIANT=preview" >> "$GITHUB_ENV"
              ;;
          esac      

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Making Sentry token available
        run: |
          rm -rf .sentryclirc
          echo "[auth]\ntoken=${{ secrets.SENTRY_AUTH_TOKEN }}" >> .sentryclirc

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build
        run: |
          rm -rf .env.local
          npm run eas-build:testflight-${{ env.APP_VARIANT }}

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --file ./local-builds/testflight/${{ env.APP_VARIANT }}/meowie.ipa \
            --type ios \
            --username ${{ secrets.APPLE_ID }} \
            --password ${{ secrets.APP_SPECIFIC_PASSWORD }}

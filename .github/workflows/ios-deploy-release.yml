name: Deploy and Release

on:
  push:
    branches:
      - ios-preview
      - ios-production

# Global permissions (needed for creating releases/tags)
permissions:
  contents: write

jobs:
  # --- JOB 0: Calculate Version First ---
  # We run this first so we can pass the version number to the Build job.
  calculate-version:
    runs-on: ubuntu-latest
    env:
      PREVIEW_BRANCH: ios-preview
      PRODUCTION_BRANCH: ios-production
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
      is_prerelease: ${{ steps.config.outputs.IS_PRERELEASE }}
      suffix: ${{ steps.config.outputs.SUFFIX }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      # 1. Setup variables
      - name: Set Release Config
        id: config
        run: |
          if [[ "${{ github.ref_name }}" == "$PRODUCTION_BRANCH" ]]; then
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "SUFFIX=" >> $GITHUB_OUTPUT
            echo "Environment: Production (Release)"
          else
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "SUFFIX=beta" >> $GITHUB_OUTPUT
            echo "Environment: Preview (Pre-release)"
          fi

      # 2. Calculate Tag (Dry Run - just to get the number)
      - name: Bump Version
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "v"
          dry_run: true
          append_to_pre_release_tag: ${{ steps.config.outputs.SUFFIX }}

  # --- JOB 1: Build and upload to TestFlight ---
  build-and-upload:
    needs: calculate-version
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine APP_VARIANT
        run: |
          case "${{ github.ref_name }}" in
            ios-production)
              echo "APP_VARIANT=production" >> "$GITHUB_ENV"
              ;;
            ios-preview)
              echo "APP_VARIANT=preview" >> "$GITHUB_ENV"
              ;;
          esac      

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Making Sentry token available
        run: |
          rm -rf .sentryclirc
          echo "[auth]\ntoken=${{ secrets.SENTRY_AUTH_TOKEN }}" >> .sentryclirc

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Cache CocoaPods
        id: pod-cache
        uses: actions/cache@v4
        with:
          path: ios/Pods
          # This key ensures we invalidate the cache if package.json or the lockfile changes
          key: ${{ runner.os }}-pods-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: EAS Build
        env:
          APP_VERSION: ${{ needs.calculate-version.outputs.new_tag }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          rm -rf .env.local
          npm run eas-build:testflight-${{ env.APP_VARIANT }}

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --file ./local-builds/testflight/${{ env.APP_VARIANT }}/meowie.ipa \
            --type ios \
            --username ${{ secrets.APPLE_ID }} \
            --password ${{ secrets.APP_SPECIFIC_PASSWORD }}

  # --- JOB 2: RELEASE (Runs only after Deploy succeeds) ---
  smart-release:
    needs: [ build-and-upload, calculate-version ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'


      # 3. Create the Release
      # Since we already calculated the tag in job 0, we just create the tag/release here
      # We use the same 'Bump Version' action (without dry_run) to handle the git tagging
      - name: Bump Version and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "v"
          append_to_pre_release_tag: ${{ needs.calculate-version.outputs.suffix }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ needs.calculate-version.outputs.is_prerelease == 'false' && 'Production' || 'Preview' }} Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          prerelease: ${{ needs.calculate-version.outputs.is_prerelease }}
          draft: false

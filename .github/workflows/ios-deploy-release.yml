name: Deploy and Release

on:
  push:
    branches:
      - ios-preview
      - ios-production

permissions:
  contents: write

jobs:
  # --- JOB 0: Calculate Version First ---
  # We run this first so we can pass the version number to the Build job.
  calculate-version:
    runs-on: ubuntu-latest
    env:
      PREVIEW_BRANCH: ios-preview
      PRODUCTION_BRANCH: ios-production
    outputs:
      final_tag: ${{ steps.format.outputs.FINAL_TAG }}
      clean_version: ${{ steps.format.outputs.CLEAN_VERSION }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: "0"

      # 1. Calculate the Next "Clean" Patch Version (e.g., v1.0.2)
      - name: Calculate Next Version
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "v"
          dry_run: true
          release_branches: "preview,production"

      # 2. Format the Tag and Clean Version manually
      - name: Format Version Output
        id: format
        run: |
          # The action returns 'v1.0.2'. We strip 'v' to get '1.0.2' for Apple.
          RAW_TAG="${{ steps.tag_version.outputs.new_tag }}"
          CLEAN_VERSION="${RAW_TAG#v}"

          if [[ "${{ github.ref_name }}" == "$PRODUCTION_BRANCH" ]]; then
            echo "FINAL_TAG=$RAW_TAG" >> $GITHUB_OUTPUT
            echo "Environment: Production ($RAW_TAG)"
          else
            # Force the -beta suffix manually
            echo "FINAL_TAG=${RAW_TAG}-beta" >> $GITHUB_OUTPUT
            echo "Environment: Preview (${RAW_TAG}-beta)"
          fi

          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_OUTPUT

  # --- JOB 1: Build and upload to TestFlight ---
  build-and-upload:
    needs: calculate-version
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Determine APP_VARIANT
        run: |
          case "${{ github.ref_name }}" in
            ios-production)
              echo "APP_VARIANT=production" >> "$GITHUB_ENV"
              ;;
            ios-preview)
              echo "APP_VARIANT=preview" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Making Sentry token available
        run: |
          rm -rf .sentryclirc
          echo -e "[auth]\ntoken=${{ secrets.SENTRY_AUTH_TOKEN }}" >> .sentryclirc

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # 2. Cache Global CocoaPods
      - name: Cache CocoaPods Global
        uses: actions/cache@v5
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          # Hash package-lock.json because the JS deps dictate the Native deps
          key: ${{ runner.os }}-pods-global-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-global-

      - name: EAS Build
        env:
          # Use Clean Version (e.g. "1.0.2") for the Apple Binary
          # Apple rejects versions with letters like "-beta"
          APP_VERSION: ${{ needs.calculate-version.outputs.clean_version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          rm -rf .env.local
          npm run eas-build:testflight-${{ env.APP_VARIANT }}

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --file ./local-builds/testflight/${{ env.APP_VARIANT }}/meowie.ipa \
            --type ios \
            --username ${{ secrets.APPLE_ID }} \
            --password ${{ secrets.APP_SPECIFIC_PASSWORD }}

  # --- JOB 2: RELEASE ---
  smart-release:
    needs: [build-and-upload, calculate-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: "0"

      # 3. Create the Release using the manually constructed tag
      # This creates v1.0.2-beta (preview) or v1.0.2 (production)
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.calculate-version.outputs.final_tag }}
          name: Release ${{ needs.calculate-version.outputs.final_tag }}
          body: ${{ needs.calculate-version.outputs.changelog }}
          prerelease: false
          draft: false

name: Deploy and Release

on:
  push:
    branches:
      - ios-preview
      - ios-production

permissions:
  contents: write

jobs:
  # --- JOB 0: PREPARE (Calculate Version) ---
  prepare:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.calc_version.outputs.new_tag }}
      changelog: ${{ steps.calc_version.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: "0"

      - name: Calculate Version
        id: calc_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "v"
          dry_run: true
          release_branches: "ios-preview,ios-production"

  # --- JOB 1: Build and upload to TestFlight ---
  build-and-upload:
    needs: prepare
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: "0"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      # --- Environment Setup ---
      - name: Determine APP_VARIANT
        run: |
          case "${{ github.ref_name }}" in
            ios-production)
              echo "APP_VARIANT=production" >> "$GITHUB_ENV"
              ;;
            ios-preview)
              echo "APP_VARIANT=preview" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Format Version
        id: format
        run: |
          RAW_TAG="${{ needs.prepare.outputs.new_tag }}"
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "APP_VERSION=$CLEAN_VERSION" >> "$GITHUB_ENV"

      # --- Infrastructure ---
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # --- Sentry ---
      - name: Making Sentry token available
        run: |
          rm -rf .sentryclirc
          echo -e "[auth]\ntoken=${{ secrets.SENTRY_AUTH_TOKEN }}" >> .sentryclirc

      # --- Caching ---
      - name: Cache CocoaPods Global
        uses: actions/cache@v5
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          # Hash package-lock.json because the JS deps dictate the Native deps
          key: ${{ runner.os }}-pods-global-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-global-

      # --- Build ---
      - name: EAS Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          APP_VERSION: ${{ env.APP_VERSION }}
          EXPO_PUBLIC_SENTRY_RELEASE: meowie-reactnative@${{ needs.prepare.outputs.new_tag }}
        run: |
          rm -rf .env.local
          npm run eas-build:testflight-${APP_VARIANT}

      # --- Deployment ---
      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --file ./local-builds/testflight/${APP_VARIANT}/meowie.ipa \
            --type ios \
            --username ${{ secrets.APPLE_ID }} \
            --password ${{ secrets.APP_SPECIFIC_PASSWORD }}

  # --- JOB 2: RELEASE ---
  release:
    needs: [prepare, build-and-upload]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: "0"

      - name: Manage Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VER: ${{ needs.prepare.outputs.new_tag }}
          CHANGELOG: ${{ needs.prepare.outputs.changelog }}
        run: |
          if [[ "${{ github.ref_name }}" == "ios-production" ]]; then
            # 1. Create solid full release
            FINAL_TAG="$NEW_VER"
            gh release create "$FINAL_TAG" --title "Release $FINAL_TAG" --notes "$CHANGELOG" --repo ${{ github.repository }} --target ${{ github.sha }}
            
            # 2. Clean up beta release upon production deployment
            BETA_TAG="${NEW_VER}-beta"
            if gh release view "$BETA_TAG" --repo ${{ github.repository }} > /dev/null 2>&1; then
               echo "Found existing beta release: $BETA_TAG. Deleting it to avoid duplicate releases..."
               gh release delete "$BETA_TAG" --yes --cleanup-tag --repo ${{ github.repository }}
            fi
          else
            # 1. Create beta prerelease
            FINAL_TAG="${NEW_VER}-beta"
            if gh release view "$FINAL_TAG" --repo ${{ github.repository }} > /dev/null 2>&1; then
               echo "Found existing beta release. Deleting it so we can push the updated tag..."
               gh release delete "$FINAL_TAG" --yes --cleanup-tag --repo ${{ github.repository }}
               sleep 2
            fi
            gh release create "$FINAL_TAG" --title "Release $FINAL_TAG" --notes "$CHANGELOG" --prerelease --repo ${{ github.repository }} --target ${{ github.sha }}
          fi

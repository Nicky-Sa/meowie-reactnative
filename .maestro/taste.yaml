appId: com.meowie.app.preview
---
- runFlow: subflows/launch.yaml
- waitForAnimationToEnd
- tapOn: "Let's Go"
- extendedWaitUntil:
    visible: "Pick 5 or more you like"
    timeout: 30000
- assertVisible: "Pick 5 to continue"
- tapOn:
    id: "selectable-poster"
    index: 0
- tapOn:
    id: "selectable-poster"
    index: 1
- tapOn:
    id: "selectable-poster"
    index: 2
- assertVisible: "Continue \\(3/5\\)"
# A second tap on a picked poster takes the pick back
- tapOn:
    id: "selectable-poster"
    index: 2
- assertVisible: "Continue \\(2/5\\)"
- tapOn:
    id: "selectable-poster"
    index: 2
- tapOn:
    id: "selectable-poster"
    index: 3
- tapOn:
    id: "selectable-poster"
    index: 4
- tapOn: "Continue \\(5 picked\\)"
- assertVisible: "Great picks!"
- extendedWaitUntil:
    visible: "Continue with Email"
    timeout: 60000
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Next step"
    timeout: 30000
- tapOn: "Skip"
- assertVisible:
    id: "release-notes"
- tapOn:
    id: "tab-profile"
- assertVisible: "Sign in to start building your watchlist."

appId: com.meowie.app.preview
---
- runFlow: subflows/launch.yaml
- waitForAnimationToEnd
- tapOn: "Let's Go"
- extendedWaitUntil:
    visible:
      id: "selectable-poster"
    timeout: 30000
- tapOn:
    id: "selectable-poster"
    index: 0
- assertVisible: "Continue \\(1/5\\)"
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Next step"
    timeout: 30000
- repeat:
    while:
      visible: "Next step"
    commands:
      - tapOn: "Next step"
- tapOn: "Let's Go!"
- assertVisible:
    id: "release-notes"
- assertNotVisible: "Let's Go!"

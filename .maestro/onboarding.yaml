appId: com.meowie.app.preview
---
- runFlow: subflows/launch.yaml
- waitForAnimationToEnd
- tapOn: "Let's Go"
- extendedWaitUntil:
    visible:
      id: "like"
    timeout: 30000
- tapOn:
    id: "like"
- assertVisible: "1/\\d+ liked"
- tapOn:
    id: "dislike"
- tapOn:
    id: "not-seen"
- assertVisible: "1/\\d+ liked"
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Next step"
    timeout: 30000
- repeat:
    while:
      visible: "Next step"
    commands:
      - tapOn: "Next step"
- tapOn: "Let's Go!"
- assertVisible:
    id: "release-notes"
- assertNotVisible: "Let's Go!"
